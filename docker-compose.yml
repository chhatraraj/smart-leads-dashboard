services:
  mongodb:
    image: mongo:7-jammy
    container_name: gigflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gigflow-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules        # keeps container's node_modules separate from host
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gigflow-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    
volumes:
  mongo-data: